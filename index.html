<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hidden Temples of Mangalore</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(270deg, #fef6e4, #fceaff, #e0f7fa, #f8bbd0);
      background-size: 800% 800%;
      animation: gradientShift 15s ease infinite;
      color: #333;
      text-align: center;
      position: relative;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    svg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.04;
    }

    h1 {
      margin-top: 40px;
      font-size: 3em;
      color: #6b2e53;
      text-shadow: 2px 2px #fff;
    }

    p em {
      font-size: 1.2em;
      color: #333;
      background: rgba(255,255,255,0.6);
      padding: 8px 16px;
      border-radius: 10px;
    }

    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      padding: 40px 20px;
      gap: 30px;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      border-radius: 15px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.15);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      width: 250px;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 15px 25px rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
    }

    .card h3 {
      margin: 0;
      padding: 15px;
      color: #8e2a75;
    }
  </style>
</head>
<body>

  <!-- ⛩️ SVG Pattern Background -->
  <svg xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="templePattern" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
        <text x="10" y="60" font-size="40" font-family="Segoe UI">⛩️</text>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#templePattern)" />
  </svg>

  <!-- Content -->
  <h1>Hidden Gems</h1>
  <p><em>"Hidden temples of Mangalore — sacred, serene, and waiting to be discovered."</em></p>

  <div class="gallery">
    <div class="card">
      <a href="vandurga.html">
        <img src="vanadurga.jpeg" alt="Vanadurga Temple">
      </a>
      <h3>Vanadurga Temple</h3>
    </div>

    <div class="card">
      <a href="rakteshwari.html">
        <img src="rakteshwari.jpg" alt="Rakteshwari Temple">
      </a>
      <h3>Rakteshwari Temple</h3>
    </div>
  </div>

</body>
</html>
